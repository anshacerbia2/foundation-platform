name: ci

# Every check here corresponds to a rule in STD-GLB-BE-001. A rule without a check in
# this file is a suggestion, and the standard is explicit that a boundary a machine
# cannot read is a boundary that erodes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  verify:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL, not a shared one. This module owns no database — it is a
    # library, and EAD-003 forbids cross-domain persistence — but the schema it ships and
    # the parameters it binds are only verifiable against a real server. Encoding a
    # string as uuid, a []byte as jsonb, and whether the DDL parses at all are defects
    # that survive every test written against a double.
    services:
      postgres:
        # Pinned by digest, not by tag. A tag moves, so an unpinned run six months from
        # now would test against a different server with no commit to show for it, and
        # the day it breaks the change is invisible in the history.
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        # Without a health check the first connection races the server's startup, and the
        # failure reads as a broken test rather than as a container that was not ready.
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://platform:platform@localhost:5432/platform_test?sslmode=disable
      # Turns a skipped integration suite into a failure. Without it, a service container
      # that never came up would leave every database test skipped and the run green,
      # which is indistinguishable from having checked something.
      REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # STD-GLB-BE-001 does not mandate a formatter, but an unformatted diff hides the
      # change that matters inside noise, which makes review less effective.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The race detector is the only thing that distinguishes correct synchronisation
      # from synchronisation that has been lucky. This repository owns the outbox
      # dispatcher, whose workers share state by design, so this step is the gate that
      # makes its concurrency claims verifiable.
      #
      # The detector needs cgo and a C compiler matching GOARCH, which is a workstation
      # setup problem rather than a property of the code. Here it runs unconditionally,
      # so a contributor without that toolchain still cannot merge an unsynchronised
      # write.
      - name: test with race detector
        run: go test ./... -race -count=1

      # Coverage is measured over shipped packages only. Build tooling under tools/ is
      # verified by its own tests rather than by a percentage, and including it would
      # let a large tool depress a figure that is meant to describe the library.
      - name: coverage floor
        run: |
          pkgs=$(go list ./... | grep -v '/tools/' | paste -sd ' ')
          go test $pkgs -count=1 -covermode=atomic -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "shipped-package coverage: ${total}%"
          if awk "BEGIN {exit !($total < 80)}"; then
            echo "::error::coverage ${total}% is below the 80% floor"
            exit 1
          fi

      # The dead-letter temporal boundary is load-bearing OUTSIDE this repository.
      #
      # dead_lettered_at names the instant a row became a dead letter. 0003 moved its
      # default off now() -- which is the dispatcher transaction's start, and that
      # transaction publishes over HTTP once per row in the batch before writing any of
      # them, so the timestamp could be minutes early exactly when a batch is timing out
      # and producing dead letters in the first place.
      #
      # organization-control and foundation-reference read that value as evidence that a
      # projection generation built from a later snapshot saw the failed event's effect.
      # An understated value lets a snapshot taken BEFORE the event committed satisfy the
      # comparison, the incident resolves as RESNAPSHOTTED, and a revoked membership keeps
      # being served. The reason lives in two other repositories; the value is written
      # here, so the gate is here.
      #
      # A maintainer reading statement_timestamp() without that context will see an odd
      # choice and "fix" it. This step is what stops that being silent.
      #
      # Matched loosely on `SET DEFAULT statement_timestamp` rather than the whole
      # statement: foundation-reference's mutation gate went red once because a column was
      # renamed and the literal here was not, and the not-found branch below still catches
      # a real disappearance.
      - name: the dead-letter temporal boundary is load-bearing
        run: |
          file=migrations/platform/0003_dead_letter_temporal_boundary.sql
          cp "$file" "$file.orig"
          sed -i -E 's/SET DEFAULT statement_timestamp\(\)/SET DEFAULT now()/' "$file"
          if git diff --quiet "$file"; then
            echo "::error::the statement_timestamp default was not found; this check is silently passing and must be updated"
            mv "$file.orig" "$file"
            exit 1
          fi
          # Two tests rather than one. They fail for different reasons with the defect
          # restored -- one that the timestamp precedes the publish attempt, one that a
          # whole batch shares a single instant -- so running only the first would let a
          # future change satisfy it while breaking the other.
          if go test ./outbox -count=1 \
              -run 'TestDeadLetteredAtNamesTheTransitionNotTheTransactionStart|TestEachDeadLetterInABatchCarriesItsOwnTransition'; then
            echo "::error::the suite passed with DEFAULT now() restored, so it does not test the temporal boundary"
            mv "$file.orig" "$file"
            exit 1
          fi
          echo "the temporal boundary is load-bearing: restoring now() fails both temporal tests"
          mv "$file.orig" "$file"

      # A dead letter must be replayable from its own row.
      #
      # Replaying means appending to platform.outbox again, which requires aggregate_id
      # NOT NULL and takes priority to pick the lane. Retaining neither meant a replay had
      # to read the original outbox row, and that row lives in a partition with retention:
      # once dropped, the incident record survived and the ability to act on it did not.
      #
      # REPLAYED is the only first-hand evidence the dead-letter resolution contract has --
      # the producer's own dispatcher witnessing the consumer accept the event. Every other
      # route rests on something the consumer reports about itself. So losing replay for old
      # incidents removes the one path that does not require trusting the party being
      # checked.
      - name: a dead letter retains what a replay needs
        run: |
          file=outbox/dispatcher.go
          cp "$file" "$file.orig"
          sed -i -E 's/envelope, payload, aggregate_id, priority,/envelope, payload,/g' "$file"
          if git diff --quiet "$file"; then
            echo "::error::the dead-letter retention columns were not found in the insert; this check is silently passing and must be updated"
            mv "$file.orig" "$file"
            exit 1
          fi
          # Only the two tests that assert the dispatcher retains it. The backfill tests
          # read platform.outbox directly, so they are unaffected by this mutation and
          # including them would weaken what a red run means.
          if go test ./outbox -count=1 \
              -run 'TestADeadLetterRetainsWhatAReplayNeeds|TestADeadLetterCanBeReplayedAfterTheOriginalIsGone'; then
            echo "::error::the suite passed without aggregate_id and priority retained, so it does not test replay sufficiency"
            mv "$file.orig" "$file"
            exit 1
          fi
          echo "replay sufficiency is load-bearing: dropping the retention fails both replay tests"
          mv "$file.orig" "$file"

      # Applied evidence must not be claimable without the consumer's marker.
      #
      # A dead letter may be resolved as REPLAYED when this producer's own dispatcher
      # witnessed the consumer accept the event -- the only evidence in the resolution
      # contract that does not rest on the consumer's report about itself. It is worth
      # exactly as much as the guarantee that "the consumer accepted it" was not inferred
      # from a broker acknowledgement.
      #
      # Receipt's field is unexported, so an adapter in another repository cannot name the
      # strong class at all; ReceiptFromMarker is the only route to it. This gate holds the
      # one place that decision is made.
      - name: applied evidence requires the consumer's marker
        run: |
          file=outbox/dispatch.go
          cp "$file" "$file.orig"
          sed -i -E 's/if marker == ApplicationReceiptApplied \{/if true {/' "$file"
          if git diff --quiet "$file"; then
            echo "::error::the marker comparison was not found; this check is silently passing and must be updated"
            mv "$file.orig" "$file"
            exit 1
          fi
          if go test ./outbox -count=1 \
              -run 'TestNoMarkerRecordsTransportEvidenceOnly|TestAnUnrecognisedMarkerIsNotAppliedEvidence'; then
            echo "::error::the suite passed while every publication claimed applied evidence, so it does not test the distinction"
            mv "$file.orig" "$file"
            exit 1
          fi
          echo "the marker is load-bearing: mapping every publication to applied evidence fails both tests"
          mv "$file.orig" "$file"

      # STD-GLB-BE-001 rules 3, 4, 7, and 12, asserted against the package graph rather
      # than against text, so an import introduced through an alias, a blank identifier,
      # or a test file is detected on the same basis as a direct one.
      - name: architecture boundaries
        run: go run ./tools/archcheck

      - name: event schema compatibility
        run: go run ./tools/schemacheck

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The only step in this file that wants the newest toolchain rather than a stable
      # one. govulncheck decides which standard library advisories apply from the
      # version it builds with, so a pinned patch reports every stdlib finding fixed
      # since that patch shipped — and clears them only when someone remembers to bump
      # a number. Floating the patch here means an advisory whose fix is a patch release
      # resolves itself, and what stays red is what actually needs a decision: a
      # vulnerability in a dependency, or one with no fix yet.
      #
      # The verify job pins deliberately. Test results have to be reproducible; a
      # vulnerability scan has to be current. Those are opposite requirements, which is
      # why the two jobs disagree on purpose.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # A dependency present in go.mod but absent from the build is debt that arrives
      # with a vulnerability report attached.
      - name: dependencies are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod or go.sum; commit the result"
            exit 1
          fi

      - name: vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
